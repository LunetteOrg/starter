name: Release the @lntt packages

# Triggered by publishing a GitHub Release (which is always backed by a tag).
#   gh release create vX.Y.Z --generate-notes
# Every published package under packages/ shares one version, and the tag must match
# it (docs/process/delivery.md). A release marked as pre-release is a dry run: every
# check runs, pnpm packs each package and `npm publish --dry-run` reads the
# tarball, nothing reaches npm.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance (no NPM token)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # npm wants a dist-tag for a pre-release version, even in a dry run.
      DRY_RUN: ${{ github.event.release.prerelease && '--dry-run --tag next' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      # Trusted publishing (OIDC) needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile

      # Before the tests: a wrong tag fails in seconds, not after the smoke.
      - name: Release tag must match the version of every published package
        run: node scripts/packages-version.mts check "${GITHUB_REF_NAME#v}"

      # Gate: never publish a broken commit. `pnpm test` packs every package and
      # installs the tarballs into a scaffolded project (SCAFFOLD_SMOKE), the same
      # checks ci.yml's full CI runs on the candidate and on every push to main, and
      # pnpm ci:local runs before a pull request leaves draft.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          SCAFFOLD_SMOKE: '1'

      # Auth is OIDC via the trusted publisher configured on npmjs.com for each
      # package, this repo and this workflow: no NPM_TOKEN secret. Each package is
      # packed by pnpm, which runs `prepack` (it builds what ships compiled) and applies
      # publishConfig's `bin` and `exports`, pointing a package the repo runs from
      # source at dist/ (docs/adr/cli-runtime-and-publishing.md); npm publishes the
      # tarball. --provenance is automatic under trusted publishing. A version already
      # on npm is skipped, so a run that failed half-way can be re-run.
      - name: Publish
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tarballs="$RUNNER_TEMP/tarballs"
          # On its own line: a failing list inside `for … in $(…)` would publish
          # nothing and leave the step green.
          dirs="$(node scripts/packages-version.mts list)"
          for dir in $dirs; do
            name="$(node -p "require('./$dir/package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm: skipped"
              continue
            fi
            rm -rf "$tarballs" && mkdir -p "$tarballs"
            (cd "$dir" && pnpm pack --pack-destination "$tarballs")
            # An absolute path: npm reads a bare file name as a git spec.
            # shellcheck disable=SC2086 # DRY_RUN holds several flags, or none
            npm publish "$(ls "$tarballs"/*.tgz)" --provenance --access public $DRY_RUN
          done
