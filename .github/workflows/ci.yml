name: CI

on:
  # Solo, trunk-based: work lands directly on main, so CI must run on push too —
  # not only on PRs — or it never runs.
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # AGENTS.md's managed block must match its source (lntt-config agents sync).
      - run: pnpm exec lntt-config agents check
      # An installed plugin updates only when its version changes.
      - if: github.event_name == 'pull_request'
        run: sh scripts/check-plugin-version.sh origin/${{ github.base_ref }}
      # Every published package carries the CLI's version (docs/adr/cli-runtime-and-publishing.md).
      - run: node scripts/packages-version.mts check
      - run: pnpm typecheck
      # scaffolds each template into a temp dir and asserts the result;
      # SCAFFOLD_SMOKE additionally installs + lints + typechecks a generated
      # project, so template-tooling breakage fails here, not post-push.
      - run: pnpm test
        env:
          SCAFFOLD_SMOKE: '1'
