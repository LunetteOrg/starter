name: CI

# What runs where (docs/process/ci.md):
# - a draft runs nothing: the job is skipped, and `ready_for_review` starts the run
#   when it leaves draft. The author has `pnpm ci:local` green before that;
# - a pull request into a candidate runs the minimal CI: what a clean machine catches
#   and the author's machine may not (frozen install, lint, typecheck, lntt check, the
#   branch name, the plugin version and its validation, the tests but the scaffold
#   level unless the change touches packages/create);
# - a pull request into the default branch (the candidate itself, a hotfix) and a push
#   to it run the full CI: every test, the scaffold level and its smoke included. The
#   push gates a release;
# - a Dependabot pull request runs the CI only once an owner, member or collaborator
#   approves it: until then the job fails in its first step, before checkout, so the `ci` check
#   is red, never skipped (a skipped job counts as passed). Every review of a Dependabot
#   pull request starts a run: an approval runs the whole job on the pull request's
#   merge ref, any other review fails in the first step like the unapproved run, so the
#   newest `ci` of a Dependabot head is either red or the whole job. A later push turns
#   it red again until the next approval. Dependabot rebases often, and a run on every
#   head nobody merges is minutes spent for nothing. A review of any other pull request
#   starts a run whose job is skipped: an entry of its own, `ci (pull_request_review)`,
#   beside the `ci (pull_request)` it does not replace. On a review event
#   `github.head_ref` and `github.base_ref` are empty: the steps read
#   `github.event.pull_request`.
#   No concurrency group: the unapproved run ends in seconds, and a group shared by the
#   review runs would let a review of any pull request cancel or queue its real run.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

# No job writes. The approval of a Dependabot pull request runs the bumped dependencies'
# code with this token: read only, for every run.
permissions:
  contents: read

jobs:
  ci:
    # Each branch tests the event first: ci:local simulates only push and pull_request,
    # and an operand it cannot know (the author) evaluated first would leave the job
    # blocked. Every review of a Dependabot pull request runs the job: the first step
    # decides whether it is an approval.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'pull_request_review' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/') &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      # A Dependabot pull request waits for the approval of an owner, member or
      # collaborator (the repository is public: anyone can submit a review): its pull
      # request run and any other review stop here. The branch prefix comes before the
      # author: ci:local knows the branch but not the author, so on any other branch it
      # knows the condition false.
      - name: Dependabot pull request not approved
        if: >-
          (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
          startsWith(github.event.pull_request.head.ref, 'dependabot/') &&
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          (github.event_name == 'pull_request' || github.event.review.state != 'approved' ||
          !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association))
        run: |
          echo "::error title=CI not run::Approve this Dependabot pull request to run the CI before merging"
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Every area of lntt check: AGENTS.md's managed block matches its source, the
      # stubs of the shared skills are installed, the decision logs follow the recording
      # rules, the tests sit at their levels.
      - run: pnpm exec lntt check
      # The branch follows type/issue/slug, whatever tool created it (lntt branch).
      - if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: pnpm exec lntt branch check --branch "$BRANCH"
      # The retrospective block of the body is filled (the retrospective skill): a
      # warning, not a gate. A body edit starts no run, so a red step would stay red
      # after the fix; each FAIL is an annotation on the pull request until the next push.
      # The candidate and Dependabot write no block of their own. ci:local has no body
      # and reports the step as not run; the skill runs lntt check body before ready.
      - if: >-
          github.event_name == 'pull_request' &&
          !startsWith(github.event.pull_request.head.ref, 'candidate/') &&
          !startsWith(github.event.pull_request.head.ref, 'dependabot/')
        continue-on-error: true
        shell: bash
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$BODY" | pnpm exec lntt check body - --json |
            jq -r 'select(.status == "FAIL") | .message | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | "::warning title=Pull request body::\(.)"'
      # An installed plugin updates only when its version changes.
      - if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: sh scripts/check-plugin-version.sh "origin/$BASE"
      # The engine refuses a hooks module its own checker refuses, and no test sees that
      # (a function given `$` must be declared at the top of its file): validate each
      # plugin with the Claude Code that loads it. It needs no login. The pinned version
      # is the one the plugin was last checked with; raise it with the plugin.
      - run: for p in plugins/*/; do pnpm dlx @anthropic-ai/claude-code@2.1.303 plugin validate "$p" || exit 1; done
      # Every published package carries the CLI's version (docs/adr/cli-runtime-and-publishing.md).
      - run: node scripts/packages-version.mts check
      - run: pnpm typecheck
      # The tests run on every ready pull request: a failure that shows only on Linux is
      # caught before the candidate. The scaffold level (`packages/create`: a project
      # generated and committed with git, the package packed with npm, and the smoke that
      # installs, lints and typechecks a generated project) is slow and depends on the
      # machine: on a pull request into a candidate it runs only when the change touches
      # packages/create; the full CI runs it always, with the smoke.
      # BASE_REF reads the review's pull request only on a review event: ci:local has no
      # pull request on a push, and an unknown value would keep the step from running.
      - run: |
          if [ "$FULL" = true ]; then SCAFFOLD_SMOKE=1 pnpm test
          elif ! git diff --quiet "origin/$BASE_REF...HEAD" -- packages/create; then pnpm test
          else pnpm test:minimal
          fi
        env:
          FULL: ${{ github.event_name == 'push' || github.event.pull_request.base.ref == github.event.repository.default_branch }}
          BASE_REF: ${{ github.event_name == 'pull_request_review' && github.event.pull_request.base.ref || github.base_ref }}
