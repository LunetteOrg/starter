name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Red on the pull request, green on a review
        run: |
          echo "event: $GITHUB_EVENT_NAME"
          [ "$GITHUB_EVENT_NAME" = pull_request_review ]