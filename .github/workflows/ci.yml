name: CI

# What runs where (docs/process/ci.md):
# - a draft runs nothing: the job is skipped, and `ready_for_review` starts the run
#   when it leaves draft. The author has `pnpm ci:local` green before that;
# - a pull request into a candidate runs the minimal CI: what a clean machine catches
#   and the author's machine may not (frozen install, lint, typecheck, the AGENTS.md
#   block, the branch name, the plugin version);
# - a pull request into the default branch (the candidate itself, a hotfix) and a push
#   to it run the full CI, tests and scaffold smoke included. The push gates a release.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  ci:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # AGENTS.md's managed block must match its source (lntt sync).
      - run: pnpm exec lntt check
      # The branch follows type/issue/slug, whatever tool created it (lntt branch).
      - if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: pnpm exec lntt branch check --branch "$BRANCH"
      # An installed plugin updates only when its version changes.
      - if: github.event_name == 'pull_request'
        run: sh scripts/check-plugin-version.sh origin/${{ github.base_ref }}
      # Every published package carries the CLI's version (docs/adr/cli-runtime-and-publishing.md).
      - run: node scripts/packages-version.mts check
      - run: pnpm typecheck
      # The tests run on every ready pull request: a failure that shows only on Linux is
      # caught before the candidate. The scaffold smoke (SCAFFOLD_SMOKE: install, lint and
      # typecheck a generated project) is the heavy part and runs on the full CI only.
      - run: pnpm test
        env:
          SCAFFOLD_SMOKE: ${{ (github.event_name == 'push' || github.base_ref == github.event.repository.default_branch) && '1' || '' }}
