# Hooks are installed by `prepare` (scripts/install-hooks.sh), which points them at
# the main checkout's binary. Lefthook must not reinstall them on its own: run from a
# worktree, it would bake that worktree's path into hooks every worktree shares.
no_auto_install: true

pre-commit:
  commands:
    biome:
      # Match any staged JS/TS/JSON; biome.json's `files.includes` scopes the
      # actual checking to packages/create/{bin,test} and excludes the bundled
      # templates (which carry their own tooling and must stay verbatim). A single
      # brace group is used on purpose — lefthook doesn't match nested `{…}/{…}`.
      glob: "**/*.{ts,tsx,js,mjs,cjs,json}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      run: pnpm typecheck
    # A record of a log with boardReferences: false cites no issue: found at the commit,
    # not at ci:local after the history is written. Which logs here may cite the board:
    # docs/process/recording.md#records-cite-the-board-when-they-rest-on-an-event.
    decisions-board-refs:
      glob: "**/*.{md,mdx}"
      run: pnpm exec lntt check decisions board-refs {staged_files}
    # A test file at no level, at two, or off its level's harness: found at the commit
    # (as in #207, where moved tests sat at no level until after it). Runs only when a
    # test file named *.test.* or *.spec.* is staged; a test file a level takes under
    # another name is checked by CI (lntt check). Which file sits at which level is
    # tests.levels' call (.agents/config.jsonc).
    test-levels:
      glob: "**/*.{test,spec}.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: pnpm exec lntt check tests levels
    # The entries `lntt sync` writes in .claude/settings.json, against what the code
    # writes: runs only when either side is staged.
    claude-settings:
      glob:
        - ".claude/settings.json"
        - "packages/lntt/src/claude-settings.ts"
      run: pnpm exec lntt check plugin

pre-push:
  commands:
    # The branches being pushed follow type/issue/slug whatever created them (lntt
    # branch); CI checks the pull request's again. git gives the pushed refs on stdin.
    branch-name:
      run: pnpm exec lntt branch check --pre-push
      use_stdin: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
    # Keep commits clean (matches the template convention).
    strip-coauthor:
      run: grep -ivE '^(Co-authored-by:|🤖 Generated with)' {1} > {1}.tmp && mv {1}.tmp {1}
